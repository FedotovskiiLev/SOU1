plugins { id 'com.android.application' }
android {
    namespace 'org.sou1'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.sou1'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ["$buildDir/generated/webAssets"] } }
    lint { abortOnError true }
}

// Do not bundle downloadable APKs inside the APK itself.
 tasks.register('syncWebAssets', Sync) {
    from('../docs')
    exclude('downloads/**')
    into(layout.buildDirectory.dir('generated/webAssets'))
 }
 tasks.named('preBuild').configure { dependsOn('syncWebAssets') }
