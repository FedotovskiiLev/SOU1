<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="SOU1 — an evolving ambient instrument for focus and quiet work."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>SOU1 — Ambient instrument</title></head>
<body><main class="instrument">
<header><a class="brand" href="./" aria-label="SOU1 home">SOU<span>1</span><small>AMBIENT INSTRUMENT</small></a><div class="header-right"><span id="connection">LOCAL SYNTHESIS</span><button id="language" class="text-button" aria-label="Change language">EN / RU</button></div></header>
<section class="hero" aria-label="Playback visualizer"><div class="art-wrap"><pre id="ascii" aria-hidden="true"></pre><canvas id="orb" width="500" height="500" aria-hidden="true"></canvas><button id="play" class="orb-button" aria-label="Play"><span id="play-icon">▶</span><span id="play-label" data-i18n="begin">Play</span></button><span class="art-caption"><span class="led"></span><span id="state" aria-live="polite">STANDBY</span><span id="elapsed">00:00</span></span></div></section>
<section class="transport" aria-label="Playback"><div class="volume"><label for="volume" data-i18n="volume">OUTPUT</label><input id="volume" type="range" min="0" max="100" value="35" aria-label="Output volume"><output id="volume-value">35%</output></div><label class="timer"><span data-i18n="timer">SESSION</span><select id="timer" aria-label="Session timer"><option value="0" data-i18n="endless">Endless</option><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label></section>
<section class="sound-section" aria-labelledby="sound-title"><div class="section-label"><h2 id="sound-title" data-i18n="sound">SOUND</h2></div><div class="presets"><button class="preset selected" data-preset="focus"><span>01</span><strong data-i18n="focus">Focus</strong></button><button class="preset" data-preset="dusk"><span>02</span><strong data-i18n="dusk">Dusk</strong></button><button class="preset" data-preset="drift"><span>03</span><strong data-i18n="drift">Drift</strong></button><button class="preset" data-preset="bloom"><span>04</span><strong data-i18n="bloom">Bloom</strong></button></div></section>
<section class="control-section" aria-labelledby="controls-title"><div class="section-label"><h2 id="controls-title" data-i18n="controls">CONTROLS</h2><span data-i18n="knobHint">Drag up / down · arrow keys</span></div><div id="knobs" class="knobs"></div><div id="layers" class="knobs layers"></div></section>
<section class="control-section" aria-labelledby="effects-title"><div class="section-label"><h2 id="effects-title" data-i18n="effects">EFFECTS</h2></div><div id="effects" class="knobs"></div></section>
<section class="control-section" aria-labelledby="environment-title"><div class="section-label"><h2 id="environment-title" data-i18n="environment">ENVIRONMENT</h2></div><div class="weather-options"><label><input id="rain-enabled" type="checkbox"><span data-i18n="rain">Rain</span></label><select id="rain-type" aria-label="Rain type"><option value="1" data-i18n="lightRain">Light rain</option><option value="2" data-i18n="steadyRain">Steady rain</option><option value="3" data-i18n="heavyRain">Heavy rain</option></select><label><input id="thunder-enabled" type="checkbox"><span data-i18n="thunder">Thunder</span></label><label><input id="wind-enabled" type="checkbox"><span data-i18n="wind">Wind</span></label></div><div id="weather" class="knobs"></div></section>
<section class="bottom-line"><div class="seed"><span data-i18n="seed">SEED</span><code id="seed-value"></code><button id="new-seed" class="text-button" data-i18n="newSeed">New session ↗</button></div><button id="update-app" class="text-button" hidden data-i18n="updateApp">Update ↻</button><button id="install" class="text-button" hidden data-i18n="install">Install PWA ↓</button></section>
<p id="notice" role="status" class="notice" data-i18n="quiet"></p>
<footer><span>© SOU1 · AGPL-3.0</span><nav aria-label="Project links"><a href="https://github.com/FedotovskiiLev/SOU1" target="_blank" rel="noopener noreferrer" data-i18n="source">Source code ↗</a><a id="apk" aria-disabled="true" data-i18n="apkPending">Android APK · preparing</a></nav></footer>
</main><script type="module" src="app.js"></script></body></html>
