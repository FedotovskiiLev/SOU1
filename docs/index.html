<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="SOU1 — an evolving ambient instrument for focus and quiet work."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>SOU1 — Ambient instrument</title></head>
<body><div id="stars" aria-hidden="true"></div><main class="instrument">
<header><a class="brand" href="./" aria-label="SOU1 home">SOU<span>1</span></a><div class="header-right"><span id="connection">LOCAL SYNTHESIS</span><button id="language" class="text-button" aria-label="Change language">EN / RU</button></div></header>
<section class="hero" aria-label="Playback visualizer"><div class="art-wrap"><canvas id="ascii" width="600" height="600" aria-hidden="true"></canvas><canvas id="orb" width="500" height="500" aria-hidden="true"></canvas><button id="play" class="orb-button" aria-label="Play"><span id="play-icon">▶</span><span id="play-label" data-i18n="begin">Play</span></button><span class="art-caption"><span class="led"></span><span id="state" aria-live="polite">STANDBY</span><span id="elapsed">00:00</span></span></div></section>
<section class="transport" aria-label="Playback"><button id="new-seed" class="seed-action" data-i18n="newSeed">New melody ↻</button><div class="volume"><label for="volume" data-i18n="volume">OUTPUT</label><input id="volume" type="range" min="0" max="100" value="35" aria-label="Output volume"><output id="volume-value">35%</output></div><label class="timer"><span data-i18n="timer">SESSION</span><select id="timer" aria-label="Session timer"><option value="0" data-i18n="endless">Endless</option><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label></section>
<section class="sound-section" aria-labelledby="sound-title"><div class="section-label"><h2 id="sound-title" data-i18n="sound">SOUND</h2></div><div class="presets"><button class="preset selected" data-preset="focus"><span>01</span><strong data-i18n="focus">Focus</strong></button><button class="preset" data-preset="dusk"><span>02</span><strong data-i18n="dusk">Dusk</strong></button><button class="preset" data-preset="drift"><span>03</span><strong data-i18n="drift">Drift</strong></button><button class="preset" data-preset="bloom"><span>04</span><strong data-i18n="bloom">Bloom</strong></button></div></section>
<nav class="workspace-tabs" aria-label="Instrument panels"><button class="selected" data-panel="composition-panel" data-i18n="controls" aria-pressed="true">Composition</button><button data-panel="tone-panel" data-i18n="voices" aria-pressed="false">Voices</button><button data-panel="effects-panel" data-i18n="effects" aria-pressed="false">Effects</button><button data-panel="weather-panel" data-i18n="environment" aria-pressed="false">Environment</button><button data-panel="midi-panel" data-i18n="midi" aria-pressed="false">MIDI</button></nav>
<section id="midi-panel" class="control-section work-panel" hidden><div class="section-label"><h2 data-i18n="midi">MIDI</h2><span data-i18n="midiScope">Generated notes · up to 512 notes</span></div><div class="midi-toolbar"><div class="midi-filters" aria-label="MIDI instruments"><button data-instrument="0" aria-pressed="true" data-i18n="pad">pad</button><button data-instrument="1" aria-pressed="true" data-i18n="pluck">pluck</button><button data-instrument="2" aria-pressed="true" data-i18n="bell">bell</button><button data-instrument="3" aria-pressed="true" data-i18n="texture">texture</button><button data-instrument="4" aria-pressed="true" data-i18n="pulse">pulse</button><button data-instrument="5" aria-pressed="true" data-i18n="kick">kick</button><button data-instrument="6" aria-pressed="true" data-i18n="snare">snare</button><button data-instrument="7" aria-pressed="true" data-i18n="hihat">hihat</button><button data-instrument="8" aria-pressed="true" data-i18n="toms">toms</button><button data-instrument="9" aria-pressed="true" data-i18n="cymbal">cymbal</button></div><button id="midi-follow" aria-pressed="true" data-i18n="midiFollow">Follow playhead</button></div><div class="midi-view"><div id="midi-scroll" tabindex="0" role="region" aria-label="MIDI piano roll, scroll time and pitch"><div id="midi-spacer"></div></div><canvas id="piano-roll" width="600" height="340" role="img" aria-label="Generated MIDI note piano roll"></canvas></div><p id="midi-summary" aria-live="polite"></p></section>
<section id="composition-panel" class="control-section work-panel" aria-labelledby="controls-title"><div class="composer-settings"><label><span>BPM</span><input id="bpm" type="range" min="30" max="180" step="1" value="72"><output id="bpm-value">72</output></label><label><span data-i18n="polyphony">POLYPHONY</span><select id="polyphony"><option value="8">8</option><option value="16" selected>16</option><option value="24">24</option><option value="32">32</option></select></label></div><div class="section-label"><h2 id="controls-title" data-i18n="controls">CONTROLS</h2><span data-i18n="knobHint">Drag up / down · arrow keys</span></div><div id="structure" class="knobs structure"></div></section><section id="tone-panel" class="control-section work-panel" hidden><div class="voice-switches"><label><input id="melody-enabled" type="checkbox" checked><span data-i18n="melody">Melody</span></label><label><input id="drums-enabled" type="checkbox"><span data-i18n="drums">Drums</span></label></div><div id="knobs" class="knobs"></div><div id="layers" class="knobs layers"></div><div class="section-label"><h2 data-i18n="drumKit">DRUM KIT</h2></div><div id="drumkit" class="knobs drumkit"></div></section>
<section id="effects-panel" class="control-section work-panel" aria-labelledby="effects-title" hidden><div class="section-label"><h2 id="effects-title" data-i18n="effects">EFFECTS</h2></div><div id="effects" class="knobs"></div></section>
<section id="weather-panel" class="control-section work-panel" aria-labelledby="environment-title" hidden><div class="section-label"><h2 id="environment-title" data-i18n="environment">ENVIRONMENT</h2></div><div class="weather-options"><label><input id="rain-enabled" type="checkbox"><span data-i18n="rain">Rain</span></label><select id="rain-type" aria-label="Rain type"><option value="1" data-i18n="lightRain">Light rain</option><option value="2" data-i18n="steadyRain">Steady rain</option><option value="3" data-i18n="heavyRain">Heavy rain</option></select><label><input id="thunder-enabled" type="checkbox"><span data-i18n="thunder">Thunder</span></label><label><input id="wind-enabled" type="checkbox"><span data-i18n="wind">Wind</span></label></div><div id="weather" class="knobs"></div></section>
<section class="bottom-line"><div class="seed"><span data-i18n="seed">SEED</span><code id="seed-value"></code></div><button id="update-app" class="text-button" hidden data-i18n="updateApp">Update ↻</button><button id="install" class="text-button" hidden data-i18n="install">Install PWA ↓</button></section>
<p id="notice" role="status" class="notice" data-i18n="quiet"></p>
<footer><span>© SOU1 · AGPL-3.0</span><nav aria-label="Project links"><a href="https://github.com/FedotovskiiLev/SOU1" target="_blank" rel="noopener noreferrer" data-i18n="source">Source code ↗</a><a id="apk" aria-disabled="true" data-i18n="apkPending">Android APK · preparing</a></nav></footer>
</main><script type="module" src="app.js"></script></body></html>
