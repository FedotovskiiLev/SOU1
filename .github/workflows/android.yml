# SPDX-License-Identifier: AGPL-3.0-only
name: Android APK verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify preinstalled Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -x "$JAVA_HOME_17_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Run deterministic JVM synthesis tests
        run: sh tests/run.sh
      - name: Verify browser DSP
        run: node tests/audio-engine.test.mjs
      - name: Verify weather and UI contracts
        run: |
          sh tests/run-environment.sh
          node tests/ui-contract.test.mjs
          node tests/viewer.test.mjs
          node tests/midi-export.test.mjs
          java tests/MidiExportReadTest.java tests/reports/midi-export-fixture.mid
          node tests/score.test.mjs
          node tests/composition.test.mjs
          node tests/composition-parity.test.mjs
          node tests/weather-parity.mjs
          node tests/layer-balance.test.mjs
      - name: Compile APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify APK signing and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SOU1-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for owner signing
        uses: actions/upload-artifact@v7
        with:
          name: SOU1-0.2.0-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
